services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - '8080:8080'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    environment:
      ADDRESS_API_BASE_URL: http://api:8080
      SESSION_SECRET: local-compose-training-secret
    ports:
      - '3000:3000'
